aid: abiomed
name: Abiomed
description: >-
  Abiomed is a Danvers, Massachusetts medical device manufacturer and, since December 22 2022, a
  standalone business inside Johnson & Johnson MedTech, which acquired it for approximately $16.6
  billion. The company designs, manufactures and supports the Impella family of percutaneous
  micro-axial heart pumps — Impella CP, 5.5, RP Flex and the SmartAssist sensor line — used for
  temporary mechanical circulatory support during high-risk percutaneous coronary intervention and
  in cardiogenic shock, alongside the Automated Impella Controller console, the Breethe OXY-1 ECMO
  system and the Impella Connect remote case-review service. Its product is regulated hardware sold
  to hospitals and cath labs, supported by a 24/7 clinical support centre, not software sold to
  developers. Abiomed's digital surface is limited to two end-user products: Impella Connect, a
  customer-only clinician portal that receives one-way RTMPS video of the console screen over port
  443, and the Impella App for clinical reference. Abiomed publishes no developer portal, no API
  reference, no OpenAPI or other machine-readable specification, no SDK on npm, PyPI or any other
  registry, and maintains no public source-code organisation; the corporate site abiomed.com now
  redirects to the brand site at heartrecovery.com.
