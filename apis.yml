  detail: >-
    Abiomed sells regulated cardiac hardware — the Impella heart-pump family and its Automated
    Impella Controller console — and its only software is two end-user products with no developer
    surface: the customer-only Impella Connect clinician portal, whose Angular SPA catch-all
    answers HTTP 200 with the same HTML shell for /openapi.json, /swagger.json, /llms.txt and every
    /.well-known/* path, and the Impella App; abiomed.com 301s to www.heartrecovery.com, whose
    375-URL sitemap contains no developer, API or integration page at all, api.impellaconnect.com
    is a private portal backend that answers every path with an nginx 502, and there is no SDK on
    npm or PyPI and no Abiomed-named GitHub organisation with a single public first-party repo.
